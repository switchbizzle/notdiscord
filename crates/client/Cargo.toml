[package]
name = "client"
version = "0.95.2"
edition = "2021"

[dependencies]
shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
anyhow = { workspace = true }
dioxus = { version = "0.7", features = ["desktop"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
chrono = "0.4"
dirs = "6"
pulldown-cmark = { version = "0.13", default-features = false }
open = "5"
rfd = "0.15"
livekit = { version = "0.8", features = ["native-tls"] }
cpal = "0.18"
nnnoiseless = { version = "0.5", default-features = false }
device_query = "4"
tray-icon = "0.21"
windows-capture = "2"
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"] }
winit = "0.30"
softbuffer = "0.4"
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fontdue = "0.9.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["playsoundapi", "synchapi", "handleapi", "errhandlingapi", "winuser", "winerror", "combaseapi", "objbase", "dwmapi"] }

[target.'cfg(windows)'.build-dependencies]
# Stamps assets/app.ico into the exe, which is what Explorer, the taskbar and
# the SmartScreen dialog all read.
winresource = "0.1"
