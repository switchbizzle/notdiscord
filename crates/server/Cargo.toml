[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
anyhow = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.3"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"
# Web Push (RFC 8291 encryption + RFC 8292 VAPID), implemented directly:
# the web-push crate drags in OpenSSL, which we are not adding to a
# pure-Rust server. These are all RustCrypto, no C toolchain.
p256 = { version = "0.13", features = ["ecdh", "pkcs8"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
# Thumbnails. Decoders only for the formats we accept inline; no SVG/AVIF
# surface, and decoding runs under explicit memory limits.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json"] }
