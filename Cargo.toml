[workspace]
members = ["crates/shared", "crates/server", "crates/client", "crates/music-bot", "crates/webclient"]
resolver = "2"

[workspace.dependencies]
shared = { path = "crates/shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
anyhow = "1"

[profile.dev]
# The WebView/wry stack is slow in pure debug; keep deps optimized.
[profile.dev.package."*"]
opt-level = 2
