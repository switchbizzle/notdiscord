# NotDiscord self-hosting stack: server + music bot + LiveKit (voice/video)
# + Caddy (auto-HTTPS). Copy .env.example to .env, fill in four values, then:
#   docker compose up -d --build
#
# Keys for the bot (OpenRouter, GIPHY, SoundCloud, Spotify) are NOT set here.
# They live in the app, under Server settings → Bot, so changing one doesn't
# mean editing a file and restarting a container.
services:
  notdiscord:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NOTDISCORD_PUBLIC_URL: https://${DOMAIN}
      NOTDISCORD_MUSIC_URL: http://music:3001
      NOTDISCORD_LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Optional: lets the server send verification and password-reset mail.
      # Without it, accounts simply have no email attached.
      NOTDISCORD_SMTP_ADDR: ${NOTDISCORD_SMTP_ADDR:-}
      NOTDISCORD_MAIL_FROM: ${NOTDISCORD_MAIL_FROM:-}
    volumes:
      - ./data:/data
      - ./client:/data/client

  # The DJ: joins voice channels and streams audio on request. Its control
  # API is unauthenticated, so it is never published to the host — only the
  # server, on this network, can reach it.
  music:
    build:
      context: ..
      dockerfile: Dockerfile.music
    restart: unless-stopped

  livekit:
    # Matches the version NotDiscord is developed against.
    image: livekit/livekit-server:v1.13
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"                     # WebRTC over TCP (fallback)
      - "50000-50100:50000-50100/udp"   # WebRTC media

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

volumes:
  caddy_data:
  caddy_config:
